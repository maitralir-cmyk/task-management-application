{% extends "base.html" %}{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="form-page">
  <a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a>
  <section class="panel form-panel">
    <p class="eyebrow">TASK DETAILS</p><h1>{{ heading }}</h1><p class="muted">Add the details below to keep your work organized.</p>
    <form method="post" class="stack">
      <label>Task title <span class="required">*</span><input name="title" required maxlength="140" placeholder="e.g. Complete project documentation" value="{{ task.title if task else '' }}"></label>
      <label>Description<textarea name="description" rows="4" placeholder="Add notes or details...">{{ task.description if task else '' }}</textarea></label>
      <div class="form-grid">
        <label>Due date<input type="date" name="due_date" min="2000-01-01" value="{{ task.due_date if task and task.due_date else '' }}"></label>
        <label>Priority<select name="priority">{% for p in ['Low','Medium','High'] %}<option value="{{ p }}" {% if task and task.priority==p or not task and p=='Medium' %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label>
        <label>Status<select name="status">{% for s in ['Pending','In Progress','Completed'] %}<option value="{{ s }}" {% if task and task.status==s or not task and s=='Pending' %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>
      </div>
      <div class="form-actions"><a class="btn secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn primary" type="submit">Save task</button></div>
    </form>
  </section>
</div>
{% endblock %}
